<section id="crisis" class="crisis-block{% if highlight %} highlight-crisis{% endif %}" aria-labelledby="crisis-title">
  <div class="crisis-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" focusable="false"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
  </div>
  <div class="crisis-body">
    <h2 id="crisis-title">{{ crisis.heading }}</h2>
    <p>{{ crisis.intro }}</p>
    <p class="crisis-contact">{{ crisis.name }}: <span class="phone-text">{{ crisis.phone_display }}</span></p>
    <a class="btn btn-light" href="tel:{{ crisis.phone_tel }}">Call {{ crisis.phone_display }}</a>
    <p class="crisis-counsellor">{{ crisis.counsellor_prompt }}</p>
    <p class="crisis-tag">{{ crisis.footer_tag }}</p>
  </div>
</section>
