{# Canonical, Open Graph and Twitter tags for pages that search engines may index. #}
<link rel="canonical" href="{{ canonical_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mapenzi ya 30 | #IAMBRAVE">
<meta property="og:locale" content="en_KE">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">

<meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='og-image.png') }}">
<meta property="og:image:width" content="1200">
